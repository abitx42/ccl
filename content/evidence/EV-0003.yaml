id: EV-0003
claim:
  en: "Juhu Moragaon is an ancient coastal settlement documented as 'Juvem' during King Pratap Bimb's 12th-century reign in the historical chronicle Mahikavatichi Bakhar, with continuous Mangela Koli indigenous fishing stewardship."
  mr: "जुहू मोरागाव ही १२ व्या शतकातील 'महिकावतीची बखर'मध्ये राजा प्रताप बिंब यांच्या काळात 'जुवेम' म्हणून नोंदवलेली एक प्राचीन किनारपट्टी वस्ती आहे, जिथे मांगेला कोळी समाजाची अखंड मासेमारी परंपरा आहे."
  hi: "जुहू मोरागांव 12वीं शताब्दी के ऐतिहासिक ग्रंथ 'महिकावतीची बखर' में राजा प्रताप बिंब के शासनकाल के दौरान 'जुवेम' के रूप में प्रलेखित एक प्राचीन तटीय बस्ती है।"
type: secondary_source
source: "Mahikavatichi Bakhar (Historical Chronicle) & District Gazetteer"
method: "Historiographical & archival textual analysis"
researcher: "UoM CCCSS Heritage & Oral History Cohort"
state: verified
