id: EV-0005
claim:
  en: "The Maharashtra Fisheries and Revenue Departments completed joint boundary demarcation for Juhu Moragaon Koliwada in 2018 under CRZ guidelines, establishing legal recognition of traditional drying yards and protective mangrove fringes."
  mr: "सीआरझेड मार्गदर्शक तत्त्वांच्या आधारे २०१८ मध्ये महसूल आणि मत्स्यव्यवसाय विभागांनी जुहू मोरागाव कोळीवाड्याची संयुक्त सीमांकन प्रक्रिया पूर्ण केली, ज्यामुळे पारंपारिक सुकवणी जागा आणि खारफुटी संरक्षण क्षेत्राला मान्यता मिळाली."
  hi: "महाराष्ट्र मत्स्य पालन और राजस्व विभागों ने सीआरजेड दिशानिर्देशों के तहत 2018 में जुहू मोरागांव कोलीवाड़ा के लिए संयुक्त सीमांकन पूरा किया।"
type: official_document
source: "Joint Demarcation Survey Records, Maharashtra Fisheries & Revenue Departments (2018)"
method: "Government demarcation report & spatial survey audit"
researcher: "UoM CCCSS Coastal Governance Team"
state: verified
