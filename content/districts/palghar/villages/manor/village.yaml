about:
  documented_source:
    en: "Manor is an estuarine riverside settlement situated along the Vaitarna River basin in Palghar, characterized by brackish wetlands and seasonal river swelling."
    mr: "मनोर हे पालघरमधील वैतरणा नदीच्या खोऱ्यात वसलेले एक किनारपट्टीचे गाव आहे, जिथे खाडी पाणथळ जागा आणि पावसाळी पूर परिस्थिती आढळते."
    hi: "मनोर पालघर में वैतरणा नदी बेसिन के किनारे स्थित एक बस्ती है, जो खारे पानी की आर्द्रभूमि और मौसमी जलभराव से प्रभावित होती है।"
  community_account:
    en: "Elder cultivators recount changes in tidal ingress patterns over the last three decades, requiring renewed communal embankment maintenance."
    mr: "स्थानिक शेतकऱ्यांच्या अनुभवानुसार गेल्या तीन दशकांत खाऱ्या पाण्याच्या भरतीचे स्वरूप बदलले आहे, ज्यामुळे बांध दुरुस्ती आवश्यक झाली आहे."
    hi: "वरिष्ठ कृषकों के अनुसार पिछले तीन दशकों में ज्वार के पानी के पैटर्न में बदलाव आया है।"
how_to_reach:
  en: "Accessible via Mumbai-Ahmedabad National Highway (NH 48), 85 km north of Mumbai."
  mr: "मुंबई-अहमदाबाद राष्ट्रीय महामार्ग (NH 48) मार्गे मुंबईपासून ८५ किमी उत्तरेस."
