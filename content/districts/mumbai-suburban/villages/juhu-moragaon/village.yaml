about:
  documented_source:
    en: "Juhu Moragaon is an ancient coastal Koliwada settlement situated along the Arabian Sea in Mumbai Suburban district, historically documented as a tidal island settlement in 12th-century regional chronicles."
    mr: "जुहू मोरागाव ही मुंबई उपनगर जिल्ह्यातील अरबी समुद्राच्या किनाऱ्यावर वसलेली एक प्राचीन कोळीवाडा वस्ती आहे, ज्याची १२ व्या शतकातील ऐतिहासिक बखरींमध्ये भरती-ओहोटीवरील बेट वस्ती म्हणून नोंद आहे."
    hi: "जुहू मोरागांव मुंबई उपनगर जिले में अरब सागर के किनारे स्थित एक प्राचीन कोलीवाड़ा बस्ती है, जिसे 12वीं सदी के क्षेत्रीय वृत्तांतों में एक ज्वारीय द्वीप बस्ती के रूप में प्रलेखित किया गया है।"
  community_account:
    en: "Community elders recount how women have anchored the post-harvest economic cycle for generations, sorting, drying Bombay Duck on bamboo scaffolds (valan), and managing cooperative dockside auctions."
    mr: "स्थानिक ज्येष्ठांच्या अनुभवानुसार, महिला पिढ्यानपिढ्या मासे सुकवणे (वाळण बांबूवर), प्रतवारी करणे आणि सहकारी लिलाव चालवून उपजीविकेचा आर्थिक कणा सांभाळत आहेत."
    hi: "सामुदायिक बुजुर्ग बताते हैं कि महिलाएं पीढ़ियों से बांस के मचानों (वलन) पर बॉम्बे डक सुखाने, छंटाई और सहकारी नीलामी के माध्यम से आजीविका का आधार रही हैं।"
how_to_reach:
  en: "Accessible via Juhu Tara Road and V.M. Road, approximately 4 km west of Vile Parle Station."
  mr: "जुहू तारा रोड आणि व्ही. एम. रोड मार्गे विलेपार्ले रेल्वे स्थानकापासून पश्चिमेस सुमारे ४ किमी."
  hi: "जुहू तारा रोड और वी.एम. रोड के माध्यम से विले पार्ले स्टेशन से लगभग 4 किमी पश्चिम में।"
